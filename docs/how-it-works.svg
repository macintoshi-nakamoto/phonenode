<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d29922"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="400" height="300" rx="14" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="44" fill="#768390">home Wi-Fi, behind NAT, no public address</text>

  <rect x="60" y="70" width="120" height="220" rx="16" fill="none" stroke="#8b949e" stroke-width="2"/>
  <rect x="100" y="79" width="40" height="4" rx="2" fill="#8b949e"/>
  <rect x="72" y="92" width="96" height="170" rx="6" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.7"/>
  <circle cx="120" cy="277" r="5" fill="none" stroke="#8b949e" stroke-width="1.5"/>

  <text x="82" y="112" fill="#3fb950" font-weight="bold" font-size="14">pn</text>
  <circle cx="86" cy="131" r="3" fill="#3fb950"/><text x="94" y="135" fill="#768390">probe</text>
  <circle cx="86" cy="149" r="3" fill="#3fb950"/><text x="94" y="153" fill="#768390">bot</text>
  <circle cx="86" cy="167" r="3" fill="#3fb950"/><text x="94" y="171" fill="#768390">tunnel</text>
  <circle cx="86" cy="185" r="3" fill="#3fb950"/><text x="94" y="189" fill="#768390">heartbeat</text>
  <line x1="82" y1="200" x2="158" y2="200" stroke="#8b949e" stroke-width="1" opacity="0.5"/>
  <text x="82" y="216" fill="#768390" font-size="10">supervisor</text>
  <text x="82" y="230" fill="#768390" font-size="10">wake lock</text>
  <text x="82" y="244" fill="#768390" font-size="10">boot hook</text>
  <text x="82" y="258" fill="#768390" font-size="10">log rotation</text>

  <line x1="120" y1="290" x2="120" y2="304" stroke="#8b949e" stroke-width="2"/>
  <rect x="112" y="304" width="16" height="8" rx="2" fill="#8b949e"/>
  <text x="140" y="312" fill="#768390" font-size="11">on the charger, one or two watts</text>

  <text x="205" y="102" fill="#768390">Android kills it</text>
  <line x1="205" y1="108" x2="330" y2="108" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <text x="205" y="124" fill="#3fb950">restarted with backoff</text>

  <text x="205" y="150" fill="#768390">the CPU goes to sleep</text>
  <line x1="205" y1="156" x2="330" y2="156" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <text x="205" y="172" fill="#3fb950">wake lock held</text>

  <text x="205" y="198" fill="#768390">reboot, nothing comes back</text>
  <line x1="205" y1="204" x2="330" y2="204" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <text x="205" y="220" fill="#3fb950">Termux:Boot hook</text>

  <text x="205" y="246" fill="#768390">logs fill the storage</text>
  <line x1="205" y1="252" x2="330" y2="252" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <text x="205" y="268" fill="#3fb950">rotated at 5 MB</text>

  <line x1="420" y1="170" x2="556" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="488" y="158" fill="#58a6ff" text-anchor="middle">reverse SSH tunnel</text>
  <text x="486" y="188" fill="#768390" font-size="10" text-anchor="middle">outgoing connection</text>

  <rect x="560" y="120" width="140" height="100" rx="10" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="630" y="142" fill="#768390" text-anchor="middle">any cheap VPS</text>
  <rect x="576" y="152" width="108" height="9" rx="2" fill="#8b949e" opacity="0.5"/>
  <rect x="576" y="166" width="108" height="9" rx="2" fill="#8b949e" opacity="0.5"/>
  <rect x="576" y="180" width="108" height="9" rx="2" fill="#8b949e" opacity="0.5"/>
  <text x="630" y="238" fill="#58a6ff" font-size="10" text-anchor="middle">127.0.0.1:2201 there is the phone's 8022</text>

  <line x1="758" y1="155" x2="704" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="731" y="143" fill="#768390" font-size="10" text-anchor="middle">ProxyJump</text>

  <rect x="770" y="118" width="104" height="66" rx="6" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="758" y="184" width="128" height="8" rx="3" fill="#8b949e"/>
  <text x="822" y="156" fill="#3fb950" text-anchor="middle" font-size="11">$ ssh myphone</text>

  <line x1="420" y1="282" x2="556" y2="282" stroke="#d29922" stroke-width="2" marker-end="url(#aho)"/>
  <text x="488" y="270" fill="#d29922" text-anchor="middle" font-size="11">heartbeat every 5 min</text>

  <rect x="560" y="260" width="140" height="44" rx="22" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="630" y="286" fill="#768390" text-anchor="middle">healthchecks.io</text>

  <line x1="704" y1="282" x2="824" y2="282" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aho)"/>
  <text x="764" y="270" fill="#d29922" text-anchor="middle" font-size="11">alert when it stops</text>

  <rect x="830" y="270" width="36" height="24" rx="3" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <polyline points="830,272 848,286 866,272" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="848" y="312" fill="#768390" font-size="10" text-anchor="middle">mail, Telegram</text>
</svg>
